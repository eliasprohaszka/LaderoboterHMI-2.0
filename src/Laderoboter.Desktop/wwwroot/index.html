<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Laderoboter HMI</title>
    <base href="/" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: "#004F7C",
                            light: "#4b69b1",
                            dark: "#1a3170",
                        },
                        success: '#22c55e',
                        error: '#ef4444',
                        processing: '#f59e0b',
                        background: "#f2f2f2",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Laderoboter.Desktop.styles.css" />
    <link rel="stylesheet" href="_content/Laderoboter.UI/Laderoboter.UI.bundle.scp.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5;">
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top: 4px solid #3182ce; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
                <p style="color: #4a5568;">Anwendung wird geladen...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem; background: #e53e3e; color: white; text-align: center;">
        Ein Fehler ist aufgetreten.
        <a href="" class="reload" style="color: white; margin-left: 1rem;">Neu laden</a>
        <a class="dismiss" style="position: absolute; right: 1rem; cursor: pointer;">✕</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // Download a file with the given content
        function downloadFile(fileName, content, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Read a file from an input element as text
        function readFileAsText(inputId) {
            return new Promise((resolve, reject) => {
                const input = document.getElementById(inputId);
                if (!input || !input.files || input.files.length === 0) {
                    resolve(null);
                    return;
                }

                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error('Failed to read file'));
                reader.readAsText(file);
            });
        }

        // Trigger click on file input element
        function triggerFileInput(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.click();
            }
        }
    </script>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>

</html>
