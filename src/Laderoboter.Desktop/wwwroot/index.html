<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Laderoboter HMI</title>
    <base href="/" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: "#004F7C",
                            light: "#4b69b1",
                            dark: "#1a3170",
                        },
                        success: '#22c55e',
                        error: '#ef4444',
                        processing: '#f59e0b',
                        background: "#f2f2f2",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Laderoboter.Desktop.styles.css" />
    <link rel="stylesheet" href="_content/Laderoboter.UI/Laderoboter.UI.bundle.scp.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5;">
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top: 4px solid #3182ce; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
                <p style="color: #4a5568;">Anwendung wird geladen...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem; background: #e53e3e; color: white; text-align: center;">
        Ein Fehler ist aufgetreten.
        <a href="" class="reload" style="color: white; margin-left: 1rem;">Neu laden</a>
        <a class="dismiss" style="position: absolute; right: 1rem; cursor: pointer;">✕</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <!-- SortableJS for drag and drop (local) -->
    <script src="js/sortable.min.js"></script>

    <script>
        // Download a file with the given content
        function downloadFile(fileName, content, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Read a file from an input element as text
        function readFileAsText(inputId) {
            return new Promise((resolve, reject) => {
                const input = document.getElementById(inputId);
                if (!input || !input.files || input.files.length === 0) {
                    resolve(null);
                    return;
                }

                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error('Failed to read file'));
                reader.readAsText(file);
            });
        }

        // Trigger click on file input element
        function triggerFileInput(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.click();
            }
        }

// SortableJS Interop
        window.sortableInterop = {
            instances: {},

            create: function(elementId, dotNetRef) {
                const self = this;

                // Small delay to ensure DOM is ready
                setTimeout(function() {
                    const el = document.getElementById(elementId);
                    if (!el) {
                        console.error('SortableJS: Element not found:', elementId);
                        return;
                    }

                    // Destroy existing instance if any
                    if (self.instances[elementId]) {
                        self.instances[elementId].destroy();
                    }

                    self.instances[elementId] = new Sortable(el, {
                        animation: 150,
                        handle: '.drag-handle',
                        draggable: '.job-item',
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        dragClass: 'sortable-drag',
                        forceFallback: true,
                        fallbackClass: 'sortable-fallback',
                        fallbackOnBody: true,
                        swapThreshold: 0.65,
                        onEnd: function(evt) {
                            if (evt.oldIndex !== evt.newIndex) {
                                // SortableJS already moved the DOM element
                                // Just notify Blazor to update the data model
                                dotNetRef.invokeMethodAsync('OnSortEnd', evt.oldIndex, evt.newIndex);
                            }
                        }
                    });
                }, 100);
            },

            destroy: function(elementId) {
                if (this.instances[elementId]) {
                    this.instances[elementId].destroy();
                    delete this.instances[elementId];
                }
            },

            // Update sequence badges without full re-render
            updateBadges: function(elementId, sequences) {
                const el = document.getElementById(elementId);
                if (!el) return;

                const items = el.querySelectorAll('.job-item');
                items.forEach((item, index) => {
                    const badge = item.querySelector('.sequence-badge');
                    if (badge && sequences[index] !== undefined) {
                        badge.textContent = sequences[index];
                        badge.classList.add('unsaved');
                    }
                });
            },

            // Save current DOM order (job IDs)
            saveDomOrder: function(elementId) {
                const el = document.getElementById(elementId);
                if (!el) return null;

                const items = el.querySelectorAll('.job-item');
                return Array.from(items).map(item => item.getAttribute('data-job-id'));
            },

            // Restore DOM order to match saved order
            restoreDomOrder: function(elementId, jobIds) {
                const el = document.getElementById(elementId);
                if (!el || !jobIds) return;

                const items = Array.from(el.querySelectorAll('.job-item'));
                const itemMap = {};
                items.forEach(item => {
                    itemMap[item.getAttribute('data-job-id')] = item;
                });

                // Clear and re-add in correct order
                el.innerHTML = '';
                jobIds.forEach(id => {
                    if (itemMap[id]) {
                        el.appendChild(itemMap[id]);
                    }
                });
            }
        };

        // Virtual Keyboard helpers
        window.virtualKeyboard = {
            dotNetRef: null,
            isEnabled: true,
            inputCounter: 0,

            // Initialize the virtual keyboard with a .NET reference
            initialize: function(dotNetRef) {
                this.dotNetRef = dotNetRef;
                this.setupGlobalFocusHandler();
            },

            // Setup global focus handler for all inputs
            setupGlobalFocusHandler: function() {
                const self = this;

                // Use capture phase to catch focus before it bubbles
                document.addEventListener('focusin', function(e) {
                    if (!self.isEnabled || !self.dotNetRef) return;

                    const target = e.target;
                    if (!target || target.tagName !== 'INPUT') return;

                    // Check if it's a text-like input
                    const inputType = (target.type || 'text').toLowerCase();
                    const supportedTypes = ['text', 'number', 'email', 'password', 'search', 'tel', 'url'];

                    if (!supportedTypes.includes(inputType)) return;

                    // Skip inputs inside the virtual keyboard itself
                    if (target.closest('.keyboard-container')) return;

                    // Skip inputs with data-no-keyboard attribute
                    if (target.hasAttribute('data-no-keyboard')) return;

                    // Ensure the input has an ID
                    if (!target.id) {
                        target.id = 'vk-auto-' + (++self.inputCounter);
                    }

                    // Blur the input to prevent native keyboard
                    target.blur();

                    // Call .NET to show the keyboard
                    self.dotNetRef.invokeMethodAsync(
                        'OnInputFocused',
                        target.id,
                        target.value || '',
                        target.placeholder || '',
                        inputType
                    );
                }, true);
            },

            // Set value of an input element and trigger input event
            setInputValue: function(inputId, value) {
                const input = document.getElementById(inputId);
                if (input) {
                    input.value = value;
                    // Trigger input event for Blazor binding
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                }
            },

            // Get input element info
            getInputInfo: function(inputId) {
                const input = document.getElementById(inputId);
                if (input) {
                    return {
                        value: input.value || '',
                        placeholder: input.placeholder || '',
                        type: input.type || 'text'
                    };
                }
                return null;
            },

            // Enable/disable the virtual keyboard
            setEnabled: function(enabled) {
                this.isEnabled = enabled;
            },

            // Dispose
            dispose: function() {
                this.dotNetRef = null;
            }
        };
    </script>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>

</html>
